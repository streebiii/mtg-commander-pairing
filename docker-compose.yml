services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Unbedingt vor dem ersten Start durch eigene, geheime Werte ersetzen
      # (z.B. über eine .env-Datei neben dieser docker-compose.yml, die
      # docker compose automatisch einliest).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?bitte ADMIN_PASSWORD setzen}
      SESSION_SECRET: ${SESSION_SECRET:?bitte SESSION_SECRET setzen}
    volumes:
      # Persistiert die SQLite-Datenbankdatei außerhalb des Containers, damit
      # Spieler, Abende und Verlauf einen Neustart/Update überleben.
      - pairing-data:/data
    restart: unless-stopped

volumes:
  pairing-data:
