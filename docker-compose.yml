# Lokale Entwicklungs-Datenbank (MariaDB), damit lokal gegen dieselbe
# Datenbank-Engine wie in Produktion (cyon-Hosting) entwickelt wird.
#
# Die App selbst läuft NICHT hier — sie wird auf Vercel deployt (siehe
# DEPLOYMENT.md). Dieser Compose-File startet nur die Datenbank für
# `npm run dev`.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Daten löschen (z.B. für einen sauberen Neustart): docker compose down -v
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: dev-root-password
      MARIADB_DATABASE: pairing_dev
      MARIADB_USER: pairing
      MARIADB_PASSWORD: dev-password
    ports:
      - "3306:3306"
    volumes:
      - pairing-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pairing-db-data:
