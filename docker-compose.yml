# Lokale Entwicklungs-Datenbank (PostgreSQL), damit lokal gegen dieselbe
# Datenbank-Engine wie in Produktion (Vercel Postgres) entwickelt wird.
#
# Die App selbst läuft NICHT hier — sie wird auf Vercel deployt (siehe
# DEPLOYMENT.md). Dieser Compose-File startet nur die Datenbank für
# `npm run dev`.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Daten löschen (z.B. für einen sauberen Neustart): docker compose down -v
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pairing_dev
      POSTGRES_USER: pairing
      POSTGRES_PASSWORD: dev-password
    ports:
      - "5432:5432"
    volumes:
      - pairing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairing -d pairing_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pairing-db-data:
